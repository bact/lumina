<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumina — UI kit</title>
<link rel="stylesheet" href="../../colors-and-type.css">
<link rel="icon" href="../../assets/logo-mark-transparent.svg">
<style>
  html, body { margin: 0; height: 100%; background: var(--paper); overflow: hidden; }
  #root { height: 100vh; display: flex; flex-direction: column; }
  /* Lucide default tweaks */
  .lumina-icon svg { width: 100%; height: 100%; stroke-width: 1.5; }
  /* table reset */
  table { border-collapse: collapse; }

  /* ── Accessibility ──────────────────────────────────────────────── */

  /* Visible focus indicator for every keyboard-reachable element.
     Uses the system's shu glow + a high-contrast 2px outline. */
  :focus { outline: none; }
  :focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
    box-shadow: 0 0 0 4px rgba(200, 57, 42, 0.22);
    border-radius: 3px;
  }

  /* Skip link -- hidden until focused */
  .skip-link {
    position: absolute; top: 8px; left: 8px;
    background: var(--ink); color: var(--paper);
    padding: 8px 14px; border-radius: 4px;
    text-decoration: none; font-weight: 500; font-size: 13px;
    transform: translateY(-150%);
    transition: transform 120ms var(--ease-out);
    z-index: 1000;
  }
  .skip-link:focus { transform: translateY(0); }

  /* Visually hidden but readable by screen readers */
  .sr-only {
    position: absolute !important;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0);
    white-space: nowrap; border: 0;
  }

  /* scrollbars */
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-thumb { background: var(--paper-3); border-radius: 999px; border: 2px solid var(--paper); }
  *::-webkit-scrollbar-track { background: transparent; }

  /* Respect reduced-motion users */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>
<a class="skip-link" href="#main-content">Skip to main content</a>
<div id="root"></div>

<!-- React + Babel pinned per house rules -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Lucide icon library (CDN, line-icon system) -->
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

<!-- Data + UI kit modules -->
<script src="data.js"></script>
<script src="i18n.js"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="app-shell.jsx"></script>
<script type="text/babel" src="view-primitives.jsx"></script>
<script type="text/babel" src="screen-overview.jsx"></script>
<script type="text/babel" src="screen-inventory.jsx"></script>
<script type="text/babel" src="screen-conformance.jsx"></script>
<script type="text/babel" src="screen-raw.jsx"></script>
<script type="text/babel" src="screen-graph.jsx"></script>
<script type="text/babel" src="screen-vulnerabilities.jsx"></script>
<script type="text/babel" src="screen-about.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

function App() {
  const data = window.LUMINA_DATA;
  const { t, locale } = useLocale();
  const [project, setProject] = useState(data.projects[0]);
  const [screen, setScreen] = useState("dashboard");
  const [openComponent, setOpenComponent] = useState(null);

  // Keep the skip-link (which lives outside the React tree) in sync with locale
  useEffect(() => {
    const link = document.querySelector(".skip-link");
    if (link) link.textContent = t("topbar.skipToContent");
  }, [locale]);

  // Make sure Lucide is ready
  useEffect(() => {
    const tick = () => { if (window.lucide) window.lucide.createIcons({ attrs: { "stroke-width": 1.5 } }); };
    tick();
    const id = setInterval(tick, 400);
    return () => clearInterval(id);
  }, [screen, openComponent]);

  const goto = (s) => { setOpenComponent(null); setScreen(s); };
  const openComp = (c) => { setScreen("inventory"); setOpenComponent(c); };

  let view;
  if (openComponent) {
    view = <ComponentDetailScreen component={openComponent} data={data} onBack={() => setOpenComponent(null)} />;
  } else if (screen === "dashboard") {
    view = <OverviewScreen project={project} data={data}
      onOpenInventory={() => goto("inventory")}
      onOpenConformance={() => goto("conformance")} />;
  } else if (screen === "inventory") {
    view = <InventoryScreen data={data} onOpenComponent={(c) => setOpenComponent(c)} />;
  } else if (screen === "raw") {
    view = <RawScreen data={data} onOpenComponent={openComp} />;
  } else if (screen === "graph") {
    view = <GraphScreen data={data} onOpenComponent={openComp} />;
  } else if (screen === "conformance") {
    view = <ConformanceScreen data={data} onOpenComponent={openComp} />;
  } else if (screen === "vulns") {
    view = <VulnerabilitiesScreen data={data} onOpenComponent={openComp} />;
  } else if (screen === "upload") {
    view = <ImportScreen onComplete={() => goto("inventory")} />;
  } else if (screen === "about") {
    view = <AboutScreen data={data} />;
  }

  const screenLabel = openComponent ? "Component detail" : screen;

  return (
    <>
      <TopBar project={project} projects={data.projects} onSwitchProject={setProject} />
      <div style={{ display: "flex", flex: 1, minHeight: 0 }}>
        <SideNav current={openComponent ? "inventory" : screen} onNav={goto} />
        <main id="main-content"
          data-screen-label={screenLabel}
          aria-label={t("main.label", { screen: screenLabel }) || `${screenLabel} screen`}
          tabIndex="-1"
          style={{ flex: 1, overflow: "auto", background: "var(--paper)" }}>
          {view}
        </main>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
