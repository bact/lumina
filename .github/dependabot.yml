# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
- package-ecosystem: "pip"
  cooldown:
    default-days: 7
  directory: "/backend"
  schedule:
    interval: "weekly"
  open-pull-requests-limit: 10

- package-ecosystem: "github-actions"
  cooldown:
    default-days: 7
  directory: "/"
  schedule:
    interval: "weekly"
  groups:
    codeql-action:
      patterns:
        - "github/codeql-action*"
          
# Base images of the Dockerfiles. docker/hfspaces/Dockerfile names the same
# python image as docker/standalone/, so all base-image bumps share one PR.
- package-ecosystem: "docker"
  cooldown:
    default-days: 7
  directories:
  - "/backend"
  - "/proxy"
  - "/docker/standalone"
  - "/docker/hfspaces"
  schedule:
    interval: "weekly"
  groups:
    base-images:
      patterns:
      - "*"
  # Python stays on 3.14 until the dependencies of the content-type extra
  # (magika, onnxruntime) publish 3.15 wheels: the 3.15 image failed to build
  # in Cloud Build (no onnxruntime for 3.15). CI tests on 3.14 too. Patch
  # updates of the image still come through.
  ignore:
  - dependency-name: "python"
    update-types:
    - "version-update:semver-major"
    - "version-update:semver-minor"

# playwright-core, for scripts/ui-smoke.mjs.
- package-ecosystem: "npm"
  cooldown:
    default-days: 7
  directory: "/scripts"
  schedule:
    interval: "weekly"
