name: Backend tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Pitloom canonicalises licence ids with this database; without it every
      # generated SBOM carries a warning and licence ids stay as written.
      - name: Build licenseid database
        run: licenseid update

      - name: Test, type-check and lint
        run: |
          pytest
          mypy
          pylint app tests
