name: Frontend smoke test

# Runs scripts/ui-smoke.mjs: every screen in headless Chromium against mocked
# API responses (see "UI smoke test" in AGENTS.md). It needs no network because
# the page's scripts are vendored in frontend/vendor/.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"

      # playwright-core drives the Chrome that ubuntu-latest already has, so
      # no browser is downloaded. The node_modules directory stays outside the
      # repository.
      - name: Install playwright-core
        run: npm install --prefix "$RUNNER_TEMP/smoke" playwright-core@1.64.1

      - name: Run the UI smoke test
        env:
          LUMINA_SMOKE_NODE_MODULES: ${{ runner.temp }}/smoke/node_modules
          LUMINA_SMOKE_CHROMIUM: /usr/bin/google-chrome
        run: node scripts/ui-smoke.mjs "$RUNNER_TEMP/shots"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ui-smoke-screenshots
          path: ${{ runner.temp }}/shots
          retention-days: 7
          if-no-files-found: ignore
