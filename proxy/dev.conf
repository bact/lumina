server {
    listen 80;
    server_name _;

    # Production frontend is the default root.
    # /workspace is the project root, bind-mounted from the host.
    root /workspace/frontend;
    index index.html;

    # ── UI kit (dev only) ────────────────────────────────────────────────────
    # The kit's index.html uses ../../colors-and-type.css and ../../assets/
    # which resolve to the locations defined below.
    location /ui-kits/ {
        alias /workspace/ui-kits/;
    }

    # Design tokens and assets — the UI kit's ../../ paths resolve to these URLs.
    # Served from frontend/ so the root directory stays clean.
    location = /colors-and-type.css {
        alias /workspace/frontend/colors-and-type.css;
    }
    location /assets/ {
        alias /workspace/frontend/assets/;
    }

    # ── Production frontend ──────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ =404;
    }

    # ── API proxy ────────────────────────────────────────────────────────────
    location /api/ {
        # Keep this above the API's upload cap, LUMINA_MAX_SBOM_BYTES (default
        # 10 MiB): it limits the whole request, multipart framing included.
        # nginx's own default, 1m, would refuse many real SBOMs.
        client_max_body_size 11m;
        proxy_pass         http://api:8000/api/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
