# Development overrides — loaded automatically by `docker compose up`.
# For production (no ui-kit), use: docker compose -f docker-compose.yml up

services:

  nginx:
    build:
      target: dev                 # serves ui-kit at /ui-kits/lumina-app/
    volumes:
      - .:/workspace:ro           # project root → /workspace (nginx.dev.conf reads here)
