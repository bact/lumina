# Development overrides — loaded automatically by `docker compose up`.
# Without them (frontend baked into the image): docker compose -f docker-compose.yml up

services:

  nginx:
    build:
      target: dev                 # nginx config only; the frontend is mounted
    volumes:
      - ./frontend:/workspace/frontend:ro   # proxy/dev.conf serves this
