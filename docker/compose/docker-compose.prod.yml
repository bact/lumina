#
# Production overrides for docker compose on a VM.
# Apply on top of the base docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker/compose/docker-compose.prod.yml up -d --build
#
# What this changes vs the dev default:
#   - nginx: restarts always; publishes port 80 on the host
#   - api: no --reload; no source volume mount; port not exposed publicly
#   - cloudflared: named-tunnel connector (only active with --profile tunnel)

services:
  nginx:
    restart: always
    # Port 80 on the host for local health checks and direct access.
    # With Cloudflare Tunnel the tunnel connects to nginx over the compose
    # network (http://nginx:80), so you can tighten this to
    # "127.0.0.1:8080:80" if you want to keep it off the public interface.
    ports:
      - "80:80"

  api:
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    # `!reset` (Compose 2.24+) empties the lists the base file defines; a plain
    # `[]` would be merged with them and change nothing.
    volumes: !reset []   # use the baked image, not a host source mount
    ports: !reset []     # do not expose the API port directly on the host

  # Cloudflare named-tunnel connector.
  # Only starts when --profile tunnel is passed. TUNNEL_TOKEN must be set
  # in .env (see Option A, Step 5 in INSTALL.md).
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: always
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - nginx
