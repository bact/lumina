#
# supervisord config for the standalone single-container image.
# Placed in /etc/supervisor/conf.d/ so Debian's default supervisord.conf
# picks it up via its [include] directive.
# Start with: supervisord -n -c /etc/supervisor/supervisord.conf

[program:api]
command=uvicorn app.main:app --host 127.0.0.1 --port 8000
directory=/app/backend
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
