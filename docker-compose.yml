services:

  # ── Frontend: nginx serves the static frontend and proxies /api/ ─────────
  nginx:
    build:
      context: .                        # project root — frontend/ and proxy/
      dockerfile: proxy/Dockerfile
      target: prod                      # override.yml switches this to dev locally
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

  # ── API: FastAPI conformance-checking backend ────────────────────────────
  # Mode-1 SBOM generation runs in-process as a background job (see
  # docs/design.md "Background job execution"), so there is no separate worker
  # or Redis at this stage. A worker + Redis are added only at Stage 2, when
  # load justifies them.
  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"       # exposed for direct API testing
    volumes:
      - ./backend/app:/app/app  # live-reload in dev
    environment:
      - HF_TOKEN          # passed through when set on the host (Hub rate limit)
    restart: unless-stopped
