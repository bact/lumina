<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generate and check SBOMs against G7 SBOM for AI | Lumina</title>
<link rel="stylesheet" href="colors-and-type.css">
<link rel="icon" href="assets/logo-mark-transparent.svg">
<style>
  html, body { margin: 0; height: 100%; background: var(--paper); overflow: hidden; }
  #root { height: 100vh; display: flex; flex-direction: column; }
  /* Lucide default tweaks */
  .lumina-icon svg { width: 100%; height: 100%; stroke-width: 1.5; }
  /* table reset */
  table { border-collapse: collapse; }

  /* ── Accessibility ──────────────────────────────────────────────── */

  /* Visible focus indicator for every keyboard-reachable element.
     Uses the system's shu glow + a high-contrast 2px outline. */
  :focus { outline: none; }
  :focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
    box-shadow: 0 0 0 4px rgba(200, 57, 42, 0.22);
    border-radius: 3px;
  }

  /* Skip link -- hidden until focused */
  .skip-link {
    position: absolute; top: 8px; left: 8px;
    background: var(--ink); color: var(--paper);
    padding: 8px 14px; border-radius: 4px;
    text-decoration: none; font-weight: 500; font-size: 13px;
    transform: translateY(-150%);
    transition: transform 120ms var(--ease-out);
    z-index: 1000;
  }
  .skip-link:focus { transform: translateY(0); }

  /* A skip link inside the page (over a long list): hidden until focused, then
     shown in flow. */
  .skip-inline {
    position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden;
    clip: rect(0, 0, 0, 0); white-space: nowrap;
  }
  .skip-inline:focus {
    position: static; width: auto; height: auto; margin: 0; overflow: visible; clip: auto;
    align-self: flex-start; padding: 8px 14px; border-radius: 4px;
    background: var(--ink); color: var(--paper); font-size: 13px; font-weight: 500;
    text-decoration: none;
  }

  /* Visually hidden but readable by screen readers */
  .sr-only {
    position: absolute !important;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0);
    white-space: nowrap; border: 0;
  }

  /* scrollbars */
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-thumb { background: var(--paper-3); border-radius: 999px; border: 2px solid var(--paper); }
  *::-webkit-scrollbar-track { background: transparent; }

  /* The main landmark takes focus when a screen is chosen or the skip link is
     used. It is not a control, so it gets no ring; what the user does next is
     focused and ringed as usual. */
  #main-content:focus-visible { outline: none; }

  /* Respect reduced-motion users */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>
<a class="skip-link" href="#main-content">Skip to main content</a>
<div id="root"></div>

<!-- React, Babel and the Lucide icons: vendored in vendor/ (no CDN, so the page
     works offline); versions and licences in vendor/README.md -->
<script src="vendor/react-18.3.1.production.min.js"></script>
<script src="vendor/react-dom-18.3.1.production.min.js"></script>
<script src="vendor/babel-standalone-7.29.0.min.js"></script>
<script src="vendor/lucide-0.469.0.min.js"></script>
<script src="vendor/highlight-11.12.0-json.min.js"></script>

<!-- App modules (order matters: each uses the globals of the ones above) -->
<script src="i18n.js"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="app-shell.jsx"></script>
<script type="text/babel" src="screen-conformance.jsx"></script>
<script type="text/babel" src="sbom-source.jsx"></script>
<script type="text/babel" src="rule-evidence.jsx"></script>
<script type="text/babel" src="generator-log.jsx"></script>
<script type="text/babel" src="result-view.jsx"></script>
<script type="text/babel" src="screen-upload.jsx"></script>
<script type="text/babel" src="screen-about.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

// Router: one state key per side-nav item (NAV_SECTIONS in app-shell.jsx).
const SCREENS = {
  generate: ImportScreen,
  upload: UploadScreen,
  sarif: SarifScreen,
  about: AboutScreen,
};

function App() {
  const { t, locale } = useLocale();
  const [screen, setScreen] = useState("generate");
  const navigated = React.useRef(false);
  const go = (id) => { navigated.current = true; setScreen(id); };

  // Each screen has its own translated document title; choosing a screen moves
  // focus to its main landmark, so a screen reader announces where it landed.
  useEffect(() => {
    const heading = screen === "about" ? t("nav.about") : t(`screen.${screen}.title`);
    document.title = `${heading} | Lumina`;
  }, [screen, locale]);
  useEffect(() => {
    if (!navigated.current) return;
    navigated.current = false;
    document.getElementById("main-content")?.focus({ preventScroll: true });
  }, [screen]);

  // Keep the skip-link (which lives outside the React tree) in sync with locale
  useEffect(() => {
    const link = document.querySelector(".skip-link");
    if (link) link.textContent = t("topbar.skipToContent");
  }, [locale]);

  const View = SCREENS[screen];
  const screenLabel = t(navLabelKey(screen));

  return (
    <>
      <TopBar />
      <div className="app-body" style={{ display: "flex", flex: 1, minHeight: 0 }}>
        <SideNav current={screen} onNav={go} />
        <main id="main-content"
          data-screen={screen}
          aria-label={t("main.label", { screen: screenLabel })}
          tabIndex="-1"
          style={{ flex: 1, overflow: "auto", background: "var(--paper)" }}>
          {/* Screen content is English; the headings set their own language. */}
          <div lang={locale === "en" ? undefined : "en"} style={{ display: "contents" }}>
            <View />
          </div>
        </main>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
