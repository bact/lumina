<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumina</title>
<link rel="stylesheet" href="colors-and-type.css">
<link rel="icon" href="assets/logo-mark-transparent.svg">
<style>
  html, body { margin: 0; height: 100%; background: var(--paper); overflow: hidden; }
  #root { height: 100vh; display: flex; flex-direction: column; }
  /* Lucide default tweaks */
  .lumina-icon svg { width: 100%; height: 100%; stroke-width: 1.5; }
  /* table reset */
  table { border-collapse: collapse; }

  /* ── Accessibility ──────────────────────────────────────────────── */

  /* Visible focus indicator for every keyboard-reachable element.
     Uses the system's shu glow + a high-contrast 2px outline. */
  :focus { outline: none; }
  :focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
    box-shadow: 0 0 0 4px rgba(200, 57, 42, 0.22);
    border-radius: 3px;
  }

  /* Skip link -- hidden until focused */
  .skip-link {
    position: absolute; top: 8px; left: 8px;
    background: var(--ink); color: var(--paper);
    padding: 8px 14px; border-radius: 4px;
    text-decoration: none; font-weight: 500; font-size: 13px;
    transform: translateY(-150%);
    transition: transform 120ms var(--ease-out);
    z-index: 1000;
  }
  .skip-link:focus { transform: translateY(0); }

  /* Visually hidden but readable by screen readers */
  .sr-only {
    position: absolute !important;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0);
    white-space: nowrap; border: 0;
  }

  /* scrollbars */
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-thumb { background: var(--paper-3); border-radius: 999px; border: 2px solid var(--paper); }
  *::-webkit-scrollbar-track { background: transparent; }

  /* Respect reduced-motion users */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>
<a class="skip-link" href="#main-content">Skip to main content</a>
<div id="root"></div>

<!-- React + Babel pinned per house rules -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Lucide icon library (CDN, line-icon system) -->
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

<!-- App modules (order matters: each uses the globals of the ones above) -->
<script src="i18n.js"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="app-shell.jsx"></script>
<script type="text/babel" src="screen-conformance.jsx"></script>
<script type="text/babel" src="screen-upload.jsx"></script>
<script type="text/babel" src="screen-about.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

// Router: one state key per side-nav item (NAV_SECTIONS in app-shell.jsx).
const SCREENS = {
  generate: ImportScreen,
  upload: UploadScreen,
  sarif: SarifScreen,
  about: AboutScreen,
};

function App() {
  const { t, locale } = useLocale();
  const [screen, setScreen] = useState("generate");

  // Keep the skip-link (which lives outside the React tree) in sync with locale
  useEffect(() => {
    const link = document.querySelector(".skip-link");
    if (link) link.textContent = t("topbar.skipToContent");
  }, [locale]);

  // Lucide replaces <i data-lucide> placeholders; re-run as screens render.
  useEffect(() => {
    const tick = () => { if (window.lucide) window.lucide.createIcons({ attrs: { "stroke-width": 1.5 } }); };
    tick();
    const id = setInterval(tick, 400);
    return () => clearInterval(id);
  }, [screen]);

  const View = SCREENS[screen];
  const screenLabel = t(navLabelKey(screen));

  return (
    <>
      <TopBar />
      <div style={{ display: "flex", flex: 1, minHeight: 0 }}>
        <SideNav current={screen} onNav={setScreen} />
        <main id="main-content"
          data-screen={screen}
          aria-label={t("main.label", { screen: screenLabel })}
          tabIndex="-1"
          style={{ flex: 1, overflow: "auto", background: "var(--paper)" }}>
          <View />
        </main>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
